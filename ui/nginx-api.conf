# Included inside the default server {} block of the UBI nginx image (port 8080).
# "fashion-api" is resolved by podman's network DNS (container name),
# by --add-host inside a pod, or by the OpenShift Service name.
location /api/ {
    proxy_pass http://fashion-api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 5m;
}

location = /ui-healthz {
    default_type text/plain;
    return 200 "ok\n";
}
