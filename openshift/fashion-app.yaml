# Optional: deploy to OpenShift (e.g. the DO188 classroom cluster or OpenShift Local).
#   1. push the images to a registry the cluster can pull from (see lab guide, part 9)
#   2. replace REGISTRY below:  sed -i 's#REGISTRY#quay.io/<your-user>#g' openshift/fashion-app.yaml
#   3. oc apply -f openshift/fashion-app.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fashion-output
  labels: {app: fashion-mnist}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: fashion-api-token
  labels: {app: fashion-mnist}
type: Opaque
stringData:
  api_token: change-me-openshift
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fashion-db
  labels: {app: fashion-mnist}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: fashion-db
  labels: {app: fashion-mnist}
type: Opaque
stringData:
  db_password: change-me-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fashion-db
  labels: {app: fashion-mnist, component: db}
spec:
  replicas: 1
  strategy: {type: Recreate}        # never two PostgreSQL pods on one volume
  selector:
    matchLabels: {component: db}
  template:
    metadata:
      labels: {app: fashion-mnist, component: db}
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-15:latest
          ports:
            - containerPort: 5432
          env:
            - {name: POSTGRESQL_USER, value: fashion}
            - {name: POSTGRESQL_DATABASE, value: fashion}
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: fashion-db, key: db_password}
          readinessProbe:
            exec:
              command: [pg_isready]
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/pgsql/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: fashion-db}
---
apiVersion: v1
kind: Service
metadata:
  name: fashion-db           # the API connects to fashion-db:5432
  labels: {app: fashion-mnist}
spec:
  selector: {component: db}
  ports:
    - {port: 5432, targetPort: 5432}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: fashion-trainer
  labels: {app: fashion-mnist}
spec:
  backoffLimit: 1
  template:
    metadata:
      labels: {app: fashion-mnist, component: trainer}
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: REGISTRY/fashion-trainer:1.0
          env:
            - {name: EPOCHS, value: "5"}
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: output, mountPath: /output}
            - {name: data, mountPath: /data}
      volumes:
        - name: output
          persistentVolumeClaim: {claimName: fashion-output}
        - name: data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fashion-api
  labels: {app: fashion-mnist, component: api}
spec:
  replicas: 1
  selector:
    matchLabels: {component: api}
  template:
    metadata:
      labels: {app: fashion-mnist, component: api}
    spec:
      containers:
        - name: api
          image: REGISTRY/fashion-api:1.0
          ports:
            - containerPort: 8000
          env:
            - {name: APP_ENV, value: openshift}
            - {name: API_TOKEN_FILE, value: /run/secrets/fashion/api_token}
            - {name: DB_HOST, value: fashion-db}
            - {name: DB_PASSWORD_FILE, value: /run/secrets/fashion-db/db_password}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/info, port: 8000}
            initialDelaySeconds: 15
          volumeMounts:
            - {name: output, mountPath: /output, readOnly: true}
            - {name: token, mountPath: /run/secrets/fashion, readOnly: true}
            - {name: dbpass, mountPath: /run/secrets/fashion-db, readOnly: true}
      volumes:
        - name: output
          persistentVolumeClaim: {claimName: fashion-output}
        - name: token
          secret: {secretName: fashion-api-token}
        - name: dbpass
          secret: {secretName: fashion-db}
---
apiVersion: v1
kind: Service
metadata:
  name: fashion-api          # nginx in the UI proxies to http://fashion-api:8000
  labels: {app: fashion-mnist}
spec:
  selector: {component: api}
  ports:
    - {port: 8000, targetPort: 8000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fashion-ui
  labels: {app: fashion-mnist, component: ui}
spec:
  replicas: 1
  selector:
    matchLabels: {component: ui}
  template:
    metadata:
      labels: {app: fashion-mnist, component: ui}
    spec:
      containers:
        - name: ui
          image: REGISTRY/fashion-ui:1.0
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /ui-healthz, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: fashion-ui
  labels: {app: fashion-mnist}
spec:
  selector: {component: ui}
  ports:
    - {port: 8080, targetPort: 8080}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: fashion-ui
  labels: {app: fashion-mnist}
spec:
  to: {kind: Service, name: fashion-ui}
  port: {targetPort: 8080}
