# Run the API + UI as one pod from Kubernetes YAML:
#   podman kube play kube/fashion-pod.yaml
#   podman kube down kube/fashion-pod.yaml
# The fashion-output volume must already contain a trained model (run the trainer first).
# No DB_HOST here, so the API runs without the database (history card shows "not connected").
apiVersion: v1
kind: Pod
metadata:
  name: fashion-kube
  labels:
    app: fashion-mnist
spec:
  hostAliases:
    - ip: "127.0.0.1"
      hostnames: ["fashion-api"]   # containers in a pod share localhost
  containers:
    - name: api
      image: localhost/fashion-api:1.0
      env:
        - name: APP_ENV
          value: kube-play
      volumeMounts:
        - name: output
          mountPath: /output
          readOnly: true
    - name: ui
      image: localhost/fashion-ui:1.0
      ports:
        - containerPort: 8080
          hostPort: 8082
  volumes:
    - name: output
      persistentVolumeClaim:
        claimName: fashion-output   # = existing podman named volume
